name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  controle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Tokens zijn in sync met de bron
        run: pnpm tokens:check

      - name: Typecheck
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Opmaak
        run: pnpm format:check

      - name: Build
        run: pnpm build

      - name: SEO
        run: pnpm test:seo

      - name: Chromium voor de viewportcontrole
        run: pnpm exec playwright install --with-deps chromium

      - name: Viewports
        run: |
          pnpm preview &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4321 >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:4321 >/dev/null
          pnpm test:viewports
